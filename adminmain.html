<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บจัดการร้านอาหาร</title>
    <style>
        :root {
            --bg: #1a1211;
            --bg-2: #2a1a18;
            --panel: rgba(45, 32, 30, 0.9);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text: #fff7f2;
            --muted: #f4d9c2;
            --accent: #c22a33;
            --accent-2: #d3ad55;
            --button: #ff7043;
            --button-hover: #ff8c5b;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body.light-mode {
            --bg: #f3ead6;
            --bg-2: #e7d7b8;
            --panel: rgba(255, 255, 255, 0.82);
            --panel-border: rgba(92, 64, 41, 0.12);
            --text: #2f241f;
            --muted: #5f4638;
            --accent: #8b1d2d;
            --accent-2: #b47b2c;
            --button: #f06b3f;
            --button-hover: #ea5a2b;
            --shadow: rgba(71, 49, 36, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
            color: var(--text);
            transition: background 0.3s ease, color 0.3s ease;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto 0;
            height: 10px;
            z-index: 10;
            background: repeating-linear-gradient(
                90deg,
                var(--accent) 0 30px,
                var(--accent-2) 30px 34px
            );
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.25);
        }

        .page-wrap {
            position: relative;
            max-width: 960px;
            margin: 70px auto 40px;
            padding: 0 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            box-shadow: 0 18px 45px var(--shadow);
            padding: 30px 28px;
            margin-bottom: 22px;
            backdrop-filter: blur(8px);
        }

        h1,
        h2 {
            margin: 0 0 12px;
            line-height: 1.2;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 2.8rem);
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .switch-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 11;
            width: auto;
            min-width: 0;
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .button-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, var(--button), var(--button-hover));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 22px rgba(255, 112, 67, 0.22);
            font-weight: 700;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .big-button {
            padding: 18px 28px;
            font-size: 1.05rem;
            border-radius: 12px;
            min-width: 220px;
        }

        @media (max-width: 600px) {
            .page-wrap {
                margin-top: 88px;
                padding: 0 14px;
            }

            .card {
                padding: 20px 18px;
            }

            .button-row {
                flex-direction: column;
                gap: 10px;
            }

            .big-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <button class="switch-button" onclick="toggleTheme()">สวิตช์ธีม</button>

    <div class="page-wrap">
        <div class="card">
            <h1>ยินดีต้อนรับสู่เว็บจัดการร้านอาหาร</h1>
            <p>กรุณาเลือกเมนูที่คุณต้องการจัดการ</p>
            <div class="button-row">
                <button class="big-button" onclick="window.location.href='menu_management.html'">จัดการเมนูอาหาร</button>
                <button class="big-button" onclick="window.location.href='user.html'">จัดการคำสั่งซื้อ</button>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }
    </script>
</body>
</html>
