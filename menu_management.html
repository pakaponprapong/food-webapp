
<!doctype html>
<html lang="th">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>จัดการเมนูอาหาร</title>
	<style>
		:root {
			--bg: #1a1211;
			--bg-2: #2a1a18;
			--panel: rgba(45, 32, 30, 0.9);
			--panel-border: rgba(255, 255, 255, 0.08);
			--text: #fff7f2;
			--muted: #f4d9c2;
			--accent: #c22a33;
			--accent-2: #d3ad55;
			--button: #ff7043;
			--button-hover: #ff8c5b;
			--shadow: rgba(0, 0, 0, 0.3);
			--table-head: rgba(255,255,255,0.04);
			--table-border: rgba(255,255,255,0.08);
			--primary: #ff7043;
			--primary-soft: rgba(255, 112, 67, 0.12);
			--danger: #d9534f;
			--border: rgba(255,255,255,0.08);
			--spacing: 14px;
			--spacing-lg: 20px;
		}

		body.light-mode {
			--bg: #f3ead6;
			--bg-2: #e7d7b8;
			--panel: rgba(255, 255, 255, 0.82);
			--panel-border: rgba(92, 64, 41, 0.12);
			--text: #2f241f;
			--muted: #5f4638;
			--accent: #8b1d2d;
			--accent-2: #b47b2c;
			--button: #f06b3f;
			--button-hover: #ea5a2b;
			--shadow: rgba(71, 49, 36, 0.12);
			--table-head: rgba(122, 88, 64, 0.04);
			--table-border: rgba(122, 88, 64, 0.09);
			--primary: #f06b3f;
			--primary-soft: rgba(240, 107, 63, 0.12);
		}

		* { box-sizing: border-box; }

		body {
			font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
			margin: 0;
			background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
			color: var(--text);
			line-height: 1.45;
			transition: background 0.3s ease, color 0.3s ease;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0 0 auto 0;
			height: 10px;
			z-index: 10;
			background: repeating-linear-gradient(
				90deg,
				var(--accent) 0 30px,
				var(--accent-2) 30px 34px
			);
			box-shadow: 0 0 12px rgba(0, 0, 0, 0.25);
		}

		h1 {
			max-width: 980px;
			margin: 70px auto 16px;
			padding: 0 20px;
			font-size: clamp(2rem, 4vw, 2.8rem);
		}

		.wrap {
			max-width: 980px;
			margin: 0 auto;
			padding: 0 20px 28px;
		}

		.card {
			background: var(--panel);
			border: 1px solid var(--panel-border);
			border-radius: 20px;
			padding: var(--spacing-lg);
			margin-bottom: 16px;
			box-shadow: 0 18px 45px var(--shadow);
			backdrop-filter: blur(8px);
		}

		.switch-button {
			position: fixed;
			top: 20px;
			right: 20px;
			z-index: 11;
			width: auto;
			min-width: 0;
			display: inline-block;
			padding: 10px 18px;
			border: none;
			border-radius: 999px;
			background: linear-gradient(135deg, var(--accent), var(--accent-2));
			color: white;
			font-weight: 700;
			cursor: pointer;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
		}

		.form-row,
		.toolbar {
			display: flex;
			gap: 10px;
			align-items: center;
			flex-wrap: wrap;
		}

		.form-row {
			margin-bottom: 12px;
		}

		.toolbar {
			margin-bottom: 14px;
		}

		.search {
			flex: 1;
			min-width: 220px;
		}

		input,
		select,
		button {
			font: inherit;
			border-radius: 12px;
			border: 1px solid var(--panel-border);
			padding: 10px 12px;
			background: rgba(255,255,255,0.02);
			color: var(--text);
		}

		input::placeholder {
			color: var(--muted);
		}

		input:focus,
		select:focus {
			outline: none;
			border-color: var(--primary);
		}

		button {
			cursor: pointer;
		}

		.btn {
			background: linear-gradient(135deg, var(--button), var(--button-hover));
			color: #fff;
			border: none;
			font-weight: 700;
			box-shadow: 0 10px 22px rgba(255, 112, 67, 0.22);
		}

		.btn.ghost {
			background: rgba(255,255,255,0.05);
			color: var(--text);
			border: 1px solid var(--panel-border);
			box-shadow: none;
		}

		.table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 10px;
		}

		th,
		td {
			padding: 12px 10px;
			border-bottom: 1px solid var(--table-border);
			text-align: left;
		}

		th {
			font-size: 0.9rem;
			color: var(--muted);
			background: var(--table-head);
		}

		.pill {
			display: inline-block;
			padding: 5px 8px;
			border-radius: 999px;
			background: var(--primary-soft);
			color: var(--text);
			font-weight: 600;
		}

		.actions button {
			margin-right: 6px;
			padding: 7px 9px;
			border: none;
			border-radius: 8px;
			color: #fff;
			font-weight: 600;
		}

		.actions .edit {
			background: linear-gradient(135deg, #4d9bf6, #3a7bd5);
		}

		.actions .del {
			background: linear-gradient(135deg, #ff5f6d, #c62828);
		}

		.empty {
			padding: 16px;
			text-align: center;
			color: var(--muted);
		}

		.modal-backdrop {
			position: fixed;
			inset: 0;
			background: rgba(2, 6, 23, 0.5);
			display: none;
			align-items: center;
			justify-content: center;
			padding: 16px;
			z-index: 1000;
		}

		.modal {
			background: var(--panel);
			border: 1px solid var(--panel-border);
			border-radius: 20px;
			padding: 18px;
			width: min(420px, 100%);
			box-shadow: 0 18px 45px var(--shadow);
		}

		.modal .actions {
			display: flex;
			justify-content: flex-end;
			gap: 10px;
			margin-top: 14px;
		}

		.link-row {
			max-width: 980px;
			margin: 0 auto;
			padding: 24px 20px 0;
		}

		.back-link {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			text-decoration: none;
			padding: 10px 16px;
			border-radius: 999px;
			background: rgba(255,255,255,0.08);
			color: var(--text);
			border: 1px solid var(--panel-border);
			font-weight: 600;
		}

		@media (max-width: 640px) {
			.form-row,
			.toolbar {
				flex-direction: column;
				align-items: stretch;
			}
		}
	</style>
</head>
<body>
	<button class="switch-button" onclick="toggleTheme()">สวิตช์ธีม</button>

	<div class="link-row">
        <a class="back-link" href="adminmain.html">← กลับหน้าหลัก</a>
    </div>

	<h1>หน้าจัดการเมนูอาหาร</h1>
	<div class="wrap">
	<section id="add-section" class="card">
		<form id="add-form">
			<div class="form-row">
				<input type="text" id="name" placeholder="ชื่อเมนู" required />
				<input type="number" id="price" placeholder="ราคา" min="0" required />
				<select id="category" required>
					<option value="" disabled selected>เลือกประเภทอาหาร</option>
					<option value="เนื้อ">เนื้อ</option>
					<option value="ผัก">ผัก</option>
					<option value="ลูกชิ้น">ลูกชิ้น</option>
				</select>
			</div>
			<div class="form-row">
				<button type="submit" class="btn">เพิ่มเมนู</button>
				<button type="button" id="resetBtn" class="btn ghost">ล้าง</button>
			</div>
		</form>
	</section>

	<section id="list-section" class="card">
		<div class="toolbar">
			<input id="search" class="search" type="text" placeholder="ค้นหาเมนู หรือชื่อ..." />
			<select id="filterCategory">
				<option value="">ทุกประเภท</option>
				<option value="เนื้อ">เนื้อ</option>
				<option value="ผัก">ผัก</option>
				<option value="ลูกชิ้น">ลูกชิ้น</option>
			</select>
			<button id="refreshBtn" class="btn ghost">รีเฟรช</button>
		</div>
		<h2>รายการเมนู</h2>
		<table id="menu-table" class="table">
			<thead>
				<tr><th>รหัส</th><th>ชื่อ</th><th>ราคา</th><th>ประเภท</th><th>การจัดการ</th></tr>
			</thead>
			<tbody></tbody>
		</table>
	</section>
	</div>

	<div id="modal" class="modal-backdrop">
		<div class="modal" role="dialog" aria-modal="true">
			<h3 id="modalTitle">แก้ไขเมนู</h3>
			<div class="form-row">
				<input id="editName" type="text" placeholder="ชื่อเมนู" />
				<input id="editPrice" type="number" placeholder="ราคา" />
			</div>
			<div class="form-row">
				<select id="editCategory">
					<option value="เนื้อ">เนื้อ</option>
					<option value="ผัก">ผัก</option>
					<option value="ลูกชิ้น">ลูกชิ้น</option>
				</select>
			</div>
			<div class="actions">
				<button id="cancelModal" class="btn ghost">ยกเลิก</button>
				<button id="saveModal" class="btn">บันทึก</button>
			</div>
		</div>
	</div>

	<script>
		function toggleTheme() {
			document.body.classList.toggle('light-mode');
		}
	</script>

	<script>
		// Assumes simple REST API endpoints:
		// GET  /api/menus        -> [{id,name,price,category},...]
		// POST /api/menus        -> {id,name,price,category}
		// DELETE /api/menus/:id

		const apiBase = 'http://localhost:8000/api/menus';
		const tbody = document.querySelector('#menu-table tbody');
		const normalizeCategoryValue = (value) => {
			const raw = String(value ?? '').trim();
			if (!raw) return '';
			const lower = raw.toLowerCase();
			if (['meat', 'เนื้อ', 'beef', 'chicken'].includes(lower)) return 'เนื้อ';
			if (['vegetable', 'ผัก'].includes(lower)) return 'ผัก';
			if (['meatball', 'ลูกชิ้น'].includes(lower)) return 'ลูกชิ้น';
			return raw;
		};
		const form = document.getElementById('add-form');
		const searchInput = document.getElementById('search');
		const filterCategory = document.getElementById('filterCategory');
		const resetBtn = document.getElementById('resetBtn');
		const refreshBtn = document.getElementById('refreshBtn');

		let allMenus = [];
		let editingId = null;

		const modalBackdrop = document.getElementById('modal');
		const editName = document.getElementById('editName');
		const editPrice = document.getElementById('editPrice');
		const editCategory = document.getElementById('editCategory');
		const cancelModal = document.getElementById('cancelModal');
		const saveModal = document.getElementById('saveModal');

		async function fetchMenus(){
			try{
				const res = await fetch(apiBase);
				const data = await res.json();
				allMenus = Array.isArray(data) ? data : [];
				renderList(allMenus);
			}catch(e){
				console.error(e);
			}
		}

		function applyFilters(){
			const q = (searchInput.value || '').toLowerCase().trim();
			const cat = normalizeCategoryValue(filterCategory.value);
			let items = allMenus.slice();
			if(cat) items = items.filter(i=>normalizeCategoryValue(i.category)===cat);
			if(q) items = items.filter(i=> (i.name||'').toLowerCase().includes(q) || String(i.id).includes(q));
			renderList(items);
		}

		function renderList(items){
			tbody.innerHTML = '';
			if(!items.length){
				const tr = document.createElement('tr');
				tr.innerHTML = '<td colspan="5" class="empty">ยังไม่มีเมนู</td>';
				tbody.appendChild(tr);
				return;
			}
			for(const it of items){
				const tr = document.createElement('tr');
				tr.innerHTML = `
					<td>${escapeHtml(it.id)}</td>
					<td>${escapeHtml(it.name)}</td>
					<td>${escapeHtml(it.price)}</td>
					<td><span class="pill">${escapeHtml(it.category||'')}</span></td>
					<td class="actions">
						<button data-id="${escapeHtml(it.id)}" data-action="edit" class="edit">แก้ไข</button>
						<button data-id="${escapeHtml(it.id)}" data-action="delete" class="del">ลบ</button>
					</td>
				`;
				tbody.appendChild(tr);
			}
		}

		function escapeHtml(v){
			return String(v)
				.replace(/&/g,'&amp;')
				.replace(/</g,'&lt;')
				.replace(/>/g,'&gt;')
				.replace(/"/g,'&quot;')
				.replace(/'/g,'&#39;');
		}

		form.addEventListener('submit', async e =>{
			e.preventDefault();
			const name = document.getElementById('name').value.trim();
			const price = Number(document.getElementById('price').value);
			const categoryVal = document.getElementById('category').value;
			if(!name || !categoryVal) return;
			try{
				const res = await fetch(apiBase, {
					method:'POST',
					headers:{'Content-Type':'application/json'},
					body:JSON.stringify({name,price,category:categoryVal})
				});
				if(res.ok){
					document.getElementById('name').value='';
					document.getElementById('price').value='';
					document.getElementById('category').selectedIndex = 0;
					await fetchMenus();
					applyFilters();
				}else{
					console.error('Failed to add');
				}
			}catch(err){console.error(err)}
		});

		tbody.addEventListener('click', async e =>{
			const btn = e.target.closest('button[data-id]');
			if(!btn) return;
			const id = btn.getAttribute('data-id');
			const action = btn.dataset.action;
			if(action==='delete'){
				// show simple modal confirm
				if(!confirm('ต้องการลบเมนูนี้?')) return;
				try{
					const res = await fetch(apiBase + '/' + encodeURIComponent(id), {method:'DELETE'});
					if(res.ok){ await fetchMenus(); applyFilters(); } else console.error('Failed delete');
				}catch(err){console.error(err)}
				return;
			}
			if(action==='edit'){
				const item = allMenus.find(x=>String(x.id)===String(id));
				if(!item) return;
				editingId = item.id;
				editName.value = item.name || '';
				editPrice.value = item.price || '';
				editCategory.value = normalizeCategoryValue(item.category || 'เนื้อ');
				modalBackdrop.style.display = 'flex';
			}
		});

		// wire up helpers
		searchInput.addEventListener('input', ()=> applyFilters());
		filterCategory.addEventListener('change', ()=> applyFilters());
		resetBtn.addEventListener('click', ()=>{ document.getElementById('name').value=''; document.getElementById('price').value=''; document.getElementById('category').selectedIndex = 0; });
		refreshBtn.addEventListener('click', async ()=>{ await fetchMenus(); applyFilters(); });

		cancelModal.addEventListener('click', ()=>{ modalBackdrop.style.display='none'; editingId = null; });
		saveModal.addEventListener('click', async ()=>{
			if(!editingId) return;
			const payload = { name: editName.value.trim(), price: Number(editPrice.value), category: normalizeCategoryValue(editCategory.value) };
			try{
				const res = await fetch(apiBase + '/' + encodeURIComponent(editingId), { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
				if(res.ok){ modalBackdrop.style.display='none'; editingId=null; await fetchMenus(); applyFilters(); } else { console.error('Failed update'); }
			}catch(err){console.error(err)}
		});

		// initial load
		fetchMenus();
	</script>
</body>
</html>
